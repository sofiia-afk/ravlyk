<meta name="description" content="Картки клієнтів, формулювання за моделлю «Равлик», сесії, моніторинг і бланк супервізії для КПТ-консультанта">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Равлик">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f0ede6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1c18" media="(prefers-color-scheme: dark)">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'none'">

<style>/* Layout: бічна панель клієнтів + робоча область з вкладками; папір для бланку. Спокійна палітра: теплий беж, олива, м’який блакитний. */
:root {
  --bg: #f0ede6;
  --surface: #fbfaf7;
  --surface-2: #f5f2ec;
  --surface-3: #ebe7df;
  --line: #e0dbd1;
  --line-strong: #cbc4b6;
  --fg: #2a2c26;
  --fg-2: #5b5e54;
  --fg-3: #878a7f;
  --accent: #5f7350;
  --accent-strong: #4a5c3e;
  --accent-soft: #e2e8d8;
  --on-accent: #fbfaf7;
  --blue: #5f819b;
  --blue-soft: #dfe8ef;
  --sand: #a5803f;
  --sand-soft: #f0e6d2;
  --rose: #a8665a;
  --rose-soft: #f2e2dc;
  --lilac: #7a6c98;
  --lilac-soft: #e7e3ef;
  --stone-soft: #e8e5de;
  --good: #4b7a52;
  --bad: #b05d48;
  --warn: #a8812f;
  --cycle-line: #9aa58c;
  --shadow: 0 1px 2px rgba(60, 58, 45, .05), 0 6px 18px -10px rgba(60, 58, 45, .18);
  --shadow-lg: 0 24px 60px -24px rgba(40, 40, 30, .35);
  --s1: #5f7350; --s2: #5f819b; --s3: #b07a3a; --s4: #9a5f73; --s5: #7a6c98; --s6: #4e8a86;
  --paper: #ffffff;
  --scrim: rgba(30, 30, 24, .35);

  --font-display: "Alegreya", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
  --r-sm: 10px;
  --side-w: 264px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1c18; --surface: #22251f; --surface-2: #282b24; --surface-3: #30342b;
    --line: #363a30; --line-strong: #4a4f43; --fg: #e8e6de; --fg-2: #b6b6ab; --fg-3: #8a8b80;
    --accent: #a5bb90; --accent-strong: #bdd2a8; --accent-soft: #2f3929; --on-accent: #1a1c18;
    --blue: #93afc4; --blue-soft: #253039; --sand: #d1ad6c; --sand-soft: #3a3324; --rose: #d39a8d; --rose-soft: #3b2a26;
    --lilac: #b3a7d1; --lilac-soft: #2f2b3a; --stone-soft: #2c2e28; --good: #8cc495; --bad: #e0937f; --warn: #d8b468;
    --cycle-line: #6f7a62; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.6); --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.7);
    --s1: #a5bb90; --s2: #93afc4; --s3: #d9a964; --s4: #d391a8; --s5: #b3a7d1; --s6: #7fc2bd;
    --paper: #262922; --scrim: rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1a1c18; --surface: #22251f; --surface-2: #282b24; --surface-3: #30342b;
  --line: #363a30; --line-strong: #4a4f43; --fg: #e8e6de; --fg-2: #b6b6ab; --fg-3: #8a8b80;
  --accent: #a5bb90; --accent-strong: #bdd2a8; --accent-soft: #2f3929; --on-accent: #1a1c18;
  --blue: #93afc4; --blue-soft: #253039; --sand: #d1ad6c; --sand-soft: #3a3324; --rose: #d39a8d; --rose-soft: #3b2a26;
  --lilac: #b3a7d1; --lilac-soft: #2f2b3a; --stone-soft: #2c2e28; --good: #8cc495; --bad: #e0937f; --warn: #d8b468;
  --cycle-line: #6f7a62; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 8px 22px -12px rgba(0,0,0,.6); --shadow-lg: 0 24px 60px -20px rgba(0,0,0,.7);
  --s1: #a5bb90; --s2: #93afc4; --s3: #d9a964; --s4: #d391a8; --s5: #b3a7d1; --s6: #7fc2bd;
  --paper: #262922; --scrim: rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-ui); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--fg-3); }
.small { font-size: 13px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.rot180 { transform: rotate(180deg); }
h1, h2, h3, h4, h5 { margin: 0; text-wrap: balance; }
p { margin: 0; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ---------- Оболонка ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.side {
  position: sticky; top: 0; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; gap: 10px;
  padding: 18px 14px 14px max(14px, env(safe-area-inset-left, 0px));
  background: var(--surface-2); border-right: 1px solid var(--line);
}
.side-top { display: flex; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 4px 6px; text-align: left; }
.brand b { display: block; font-family: var(--font-display); font-size: 22px; font-weight: 600; line-height: 1; letter-spacing: .01em; }
.brand small { display: block; font-size: 11px; color: var(--fg-3); text-transform: uppercase; letter-spacing: .12em; margin-top: 3px; }
.logo { width: 34px; height: 34px; flex: none; }
.side .side-close { display: none; }
.side-new { width: 100%; justify-content: center; margin: 6px 0 4px; }
.side-link {
  display: flex; align-items: center; gap: 10px; width: 100%;
  padding: 8px 10px; border: 0; border-radius: var(--r-sm); background: none; color: var(--fg-2); text-align: left; font-size: 14px;
}
.side-link:hover { background: var(--surface-3); color: var(--fg); }
.side-link.is-on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.side-count { margin-left: auto; font-size: 12px; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.side-search { display: flex; align-items: center; gap: 8px; padding: 0 10px; height: 34px; border-radius: var(--r-sm); background: var(--surface); border: 1px solid var(--line); color: var(--fg-3); }
.side-search input { border: 0; background: none; outline: none; width: 100%; font-size: 13.5px; color: var(--fg); }
.side-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; margin: 0 -4px; padding: 2px 4px; }
.side-client { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border: 0; border-radius: var(--r-sm); background: none; text-align: left; font-size: 14px; color: var(--fg-2); }
.side-client:hover { background: var(--surface-3); color: var(--fg); }
.side-client.is-on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); font-weight: 600; }
.side-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
.st-paused .side-dot { background: var(--warn); }
.st-finished .side-dot { background: var(--line-strong); }
.side-none { padding: 6px 10px; }
.side-bottom { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 2px; }
.save-state { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--fg-3); padding: 6px 10px 0; }
.save-state i { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; }
.save-state.is-warn { color: var(--bad); }
.save-state.is-warn i { background: var(--bad); }
.topbar { display: none; }
.scrim { display: none; }

.main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1160px; margin: 0 auto; padding: 0 clamp(0px, 2vw, 20px); scroll-margin-top: 20px; }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .topbar {
    display: flex; align-items: center; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    padding-block: 8px; padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    background: var(--bg); border-bottom: 1px solid var(--line);
  }
  .brand-top { font-family: var(--font-display); font-size: 19px; font-weight: 600; }
  .brand-top .logo { width: 26px; height: 26px; }
  .topbar-client { margin-left: auto; font-size: 13px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .side {
    position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 40; transform: translateX(-102%);
    transition: transform .25s ease; box-shadow: var(--shadow-lg); height: 100%;
    padding-top: calc(18px + env(safe-area-inset-top, 0px));
  }
  .drawer-open .side { transform: none; }
  .side .side-close { display: inline-flex; }
  .drawer-open .scrim { display: block; position: fixed; inset: 0; z-index: 30; background: var(--scrim); }
  .main { padding-top: 18px; }
}

/* ---------- Кнопки, поля ---------- */
.icon { flex: none; }
.btn {
  display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; border-radius: 999px;
  font-weight: 600; letter-spacing: .005em; white-space: nowrap; transition: background .15s, border-color .15s, color .15s;
}
.btn-md { height: 38px; padding: 0 16px; font-size: 14px; }
.btn-sm { height: 30px; padding: 0 11px; font-size: 13px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-primary:hover { background: var(--accent-strong); }
.btn-soft { background: var(--surface); border-color: var(--line); color: var(--fg); }
.btn-soft:hover { border-color: var(--line-strong); background: var(--surface-2); }
.btn-quiet { background: none; color: var(--fg-2); }
.btn-quiet:hover { background: var(--surface-3); color: var(--fg); }
.btn-danger { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .5; cursor: default; }
.icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border: 0; border-radius: 8px; background: none; color: var(--fg-3); flex: none; }
.icon-btn:hover:not(:disabled) { background: var(--surface-3); color: var(--fg); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.linkish { background: none; border: 0; padding: 0; color: var(--accent-strong); font-size: 13px; font-weight: 600; text-align: left; }
.linkish:hover { text-decoration: underline; }
.confirm-inline { display: inline-flex; gap: 6px; flex-wrap: wrap; }

.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field-head { display: flex; align-items: center; gap: 4px; }
.field-head label, .field-label { font-size: 13px; font-weight: 600; color: var(--fg-2); }
.field-sub { font-size: 12px; color: var(--fg-3); margin-top: -4px; }
.input {
  width: 100%; min-width: 0; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r-sm);
  padding: 9px 12px; font-size: 14.5px; line-height: 1.5; color: var(--fg); transition: border-color .15s, box-shadow .15s;
}
.input::placeholder, .cell-input::placeholder { color: var(--fg-3); opacity: .8; }
.input:hover { border-color: var(--line-strong); }
.input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--fg-3) 50%), linear-gradient(135deg, var(--fg-3) 50%, transparent 50%); background-position: calc(100% - 17px) 55%, calc(100% - 12px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.textarea { resize: vertical; overflow: hidden; min-height: 44px; }
.input-sm { padding: 6px 10px; font-size: 14px; }
.input-num { max-width: 90px; }
.hint-wrap { position: relative; display: inline-flex; }
.hint-btn { display: inline-flex; border: 0; background: none; color: var(--fg-3); padding: 2px; border-radius: 50%; }
.hint-btn:hover, .hint-btn[aria-expanded="true"] { color: var(--accent-strong); }
.hint-pop {
  position: absolute; z-index: 15; top: calc(100% + 6px); left: -10px; width: min(300px, 76vw);
  background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 13px; line-height: 1.45; font-weight: 500;
  box-shadow: var(--shadow-lg);
}

.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; }
@media (max-width: 760px) { .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 761px) and (max-width: 1100px) { .grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.row-inline { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row-inline .input { flex: 1 1 180px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
  display: inline-flex; align-items: center; gap: 4px; padding: 5px 11px; border-radius: 999px; font-size: 13px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg-2);
}
.chip:hover { border-color: var(--line-strong); color: var(--fg); }
.chip.is-on { background: var(--accent-soft); border-color: transparent; color: var(--accent-strong); font-weight: 600; }
.chip-sm { padding: 3px 9px; font-size: 12.5px; }

.seg { display: inline-flex; background: var(--surface-3); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 13px; border-radius: 999px; font-size: 13.5px; color: var(--fg-2); font-weight: 600; white-space: nowrap; }
.seg button:hover { color: var(--fg); }
.seg button.is-on { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.seg-n { font-weight: 500; color: var(--fg-3); margin-left: 2px; font-variant-numeric: tabular-nums; }
.seg-sm button { padding: 4px 11px; font-size: 13px; }

.eyebrow { display: block; font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--fg-3); font-weight: 600; }
.mini-title { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 700; color: var(--fg-2); text-transform: uppercase; letter-spacing: .07em; }

/* ---------- Секції ---------- */
.tab-body { display: flex; flex-direction: column; gap: 16px; }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.section-head { display: flex; align-items: center; gap: 6px; padding: 14px 16px 14px 12px; }
.section-toggle { display: flex; align-items: center; gap: 8px; background: none; border: 0; padding: 0; text-align: left; flex: 1; min-width: 0; }
.section-chev { color: var(--fg-3); transition: transform .2s; }
.is-open .section-chev { transform: rotate(90deg); }
.section-titles { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.section-title { font-family: var(--font-display); font-size: 21px; font-weight: 600; line-height: 1.2; }
.section-actions { margin-left: auto; display: flex; gap: 6px; }
.section-body { padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px; }
.sub-head { font-size: 13px; font-weight: 700; color: var(--fg-3); text-transform: uppercase; letter-spacing: .07em; margin-bottom: -6px; }

/* ---------- Список ---------- */
.list-editor { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.list-row { display: flex; align-items: center; gap: 8px; width: 100%; }
.list-num { width: 22px; height: 22px; border-radius: 50%; background: var(--surface-3); color: var(--fg-2); font-size: 12px; font-weight: 700; display: grid; place-items: center; flex: none; font-variant-numeric: tabular-nums; }
.list-input { flex: 1; padding: 7px 10px; }

/* ---------- Головна ---------- */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-title { font-family: var(--font-display); font-weight: 600; font-size: clamp(32px, 4vw, 42px); line-height: 1.05; margin: 4px 0 6px; letter-spacing: -.005em; }
.page-lead { color: var(--fg-2); }
.upcoming { margin-bottom: 22px; }
.upcoming-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
.up-card { display: flex; flex-direction: column; gap: 2px; text-align: left; padding: 12px 14px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); box-shadow: var(--shadow); }
.up-card:hover { border-color: var(--accent); }
.up-when { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; color: var(--accent-strong); }
.up-when span { color: var(--fg-3); font-variant-numeric: tabular-nums; }
.up-who { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.up-n { font-size: 12.5px; color: var(--fg-3); }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin-bottom: 18px; }
.search { display: flex; align-items: center; gap: 8px; flex: 1 1 280px; min-width: 0; height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg-3); }
.search:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.search input { border: 0; background: none; outline: none; width: 100%; min-width: 0; color: var(--fg); }
.toolbar-selects { display: flex; gap: 10px; flex-wrap: wrap; }
.mini-select { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--fg-3); }
.mini-select select { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 10px; font-size: 13px; color: var(--fg); }
.client-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 14px; }
.client-card {
  display: flex; flex-direction: column; gap: 12px; text-align: left; padding: 16px; border-radius: var(--r);
  background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); transition: border-color .15s, transform .15s;
}
.client-card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.cc-top { display: flex; align-items: center; gap: 12px; }
.cc-id { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cc-name { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cc-meta { font-size: 13px; color: var(--fg-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cc-problem { color: var(--fg-2); font-size: 14px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.9em; }
.cc-foot { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--fg-3); border-top: 1px solid var(--line); padding-top: 10px; }
.cc-foot b { color: var(--fg); font-variant-numeric: tabular-nums; }
.cc-next { display: inline-flex; align-items: center; gap: 4px; color: var(--accent-strong); font-weight: 600; }

/* ---------- Равлик ---------- */

.snail-legend .icon { color: var(--accent); }
.snail-box { border-radius: 12px; padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; min-width: 0; border: 1px solid transparent; }
.snail-box-head { display: flex; align-items: center; gap: 4px; }

.snail-situation { grid-area: situation; background: var(--stone-soft); }
.snail-social { grid-area: social; background: var(--blue-soft); }
.snail-thoughts { grid-area: thoughts; background: var(--accent-soft); }

.sa-right-1 { grid-area: r1; } .sa-right-2 { grid-area: r2; }
.sa-down-social::before, .sa-up-behavior::before, .sa-up-personality::before { left: 50%; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; }
.sa-down-social::after { left: 50%; bottom: -4px; margin-left: -6px; border-top-color: var(--line-strong); }
.sa-up-behavior::after, .sa-up-personality::after { left: 50%; top: -4px; margin-left: -6px; border-bottom-color: var(--line-strong); }
.sa-right-1::before, .sa-right-2::before { top: 50%; left: 4px; right: 4px; height: 2px; margin-top: -1px; }
.sa-right-1::after, .sa-right-2::after { top: 50%; right: -4px; margin-top: -6px; border-left-color: var(--line-strong); }
.dist { margin-top: 4px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }

.core-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }

.emo-list { display: flex; flex-direction: column; gap: 8px; }

.emo-range { -webkit-appearance: none; appearance: none; width: 100%; height: 6px; border-radius: 4px; background: linear-gradient(to right, var(--rose) var(--v), var(--surface) var(--v)); outline: none; }

@media (max-width: 900px) {

  }

/* ---------- Цикли ---------- */
.cycle-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 400px), 1fr)); gap: 14px; }

.cycle-actions { margin-left: auto; }

  position: absolute; transform: translate(-50%, -50%); width: 37%; max-height: 30%;

}

.cycle-node .cn-label, .cycle-flow .cn-label { font-weight: 700; font-size: 12.5px; line-height: 1.25; }
.cycle-node .cn-text { font-size: 11.5px; line-height: 1.3; color: var(--fg-2); display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
.cycle-node[data-i="0"], .cycle-flow li[data-i="0"] { border-top: 3px solid var(--s1); }

.cycle-node[data-i="2"], .cycle-flow li[data-i="2"] { border-top: 3px solid var(--s3); }
.cycle-node[data-i="3"], .cycle-flow li[data-i="3"] { border-top: 3px solid var(--s4); }
.cycle-node[data-i="4"], .cycle-flow li[data-i="4"] { border-top: 3px solid var(--s5); }
.cycle-node[data-i="5"], .cycle-flow li[data-i="5"] { border-top: 3px solid var(--s6); }
.cycle-flow { display: none; list-style: none; margin: 0; padding: 0; flex-direction: column; gap: 18px; }
.cycle-flow li { position: relative; padding: 8px 11px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; gap: 2px; }

.cycle-flow li:not(:last-child)::after { content: "↓"; position: absolute; left: 50%; bottom: -18px; transform: translateX(-50%); color: var(--fg-3); font-size: 13px; line-height: 18px; }

.cycle-edit { display: flex; flex-direction: column; gap: 8px; align-items: stretch; border-top: 1px solid var(--line); padding-top: 12px; }

.cn-row { display: flex; gap: 8px; align-items: flex-start; }
.cn-dot { width: 22px; height: 22px; margin-top: 6px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 700; color: var(--on-accent); background: var(--s1); flex: none; }
.cn-dot[data-i="1"] { background: var(--s2); } .cn-dot[data-i="2"] { background: var(--s3); } .cn-dot[data-i="3"] { background: var(--s4); } .cn-dot[data-i="4"] { background: var(--s5); } .cn-dot[data-i="5"] { background: var(--s6); }
.cn-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }

.cycle-foot { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.lib { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; margin-top: 12px; }
.lib-groups { display: flex; flex-direction: column; gap: 2px; }

@media (max-width: 640px) {

}

/* ---------- План ---------- */
.stages { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.stage { display: flex; gap: 10px; align-items: flex-start; padding: 10px; border-radius: 12px; background: var(--surface-2); }

.stage.is-done .stage-check { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.stage.is-done .stage-title { text-decoration: line-through; text-decoration-color: var(--fg-3); color: var(--fg-2); }
.stage-fields { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.stage-title { font-weight: 600; padding: 7px 10px; }
.proto-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-top: 12px; }
.proto { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 8px; background: var(--surface-2); }

/* ---------- Скринінг ---------- */
.screen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 8px; }
.screen-item { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); text-align: left; }
.screen-item:hover { border-color: var(--line-strong); }
.screen-abbr { font-weight: 800; font-size: 12px; color: var(--fg-2); letter-spacing: .02em; }
.screen-label { font-size: 13px; color: var(--fg-2); line-height: 1.3; }
.screen-state { font-size: 12px; font-weight: 700; color: var(--fg-3); display: inline-flex; align-items: center; gap: 3px; }
.screen-item.is-no { background: var(--surface-2); }
.screen-item.is-no .screen-state { color: var(--good); }
.screen-item.is-yes { background: var(--sand-soft); border-color: transparent; }
.screen-item.is-yes .screen-state, .screen-item.is-yes .screen-abbr { color: var(--sand); }

/* ---------- Сесії ---------- */
.sessions-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.sessions-stats { display: flex; gap: 14px; color: var(--fg-3); font-size: 14px; }
.sessions-stats b { color: var(--fg); font-variant-numeric: tabular-nums; }
.sessions-actions { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.session-list { display: flex; flex-direction: column; gap: 8px; }
.session { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); }
.session.s-cancelled { opacity: .7; }
.session-head { width: 100%; display: grid; grid-template-columns: 38px 132px minmax(0, 1fr) auto 18px; align-items: center; gap: 12px; padding: 12px 14px; background: none; border: 0; text-align: left; }
.session-no { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; background: var(--accent-soft); color: var(--accent-strong); font-variant-numeric: tabular-nums; }
.s-planned .session-no { background: var(--blue-soft); color: var(--blue); }
.s-cancelled .session-no { background: var(--surface-3); color: var(--fg-3); }
.session-when { display: flex; flex-direction: column; font-size: 14px; line-height: 1.3; }
.session-when span { font-size: 12.5px; color: var(--fg-3); }
.session-sum { color: var(--fg-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-chev { color: var(--fg-3); transition: transform .2s; }
.session.is-open .session-chev { transform: rotate(180deg); }
.spill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
.spill-done { background: var(--accent-soft); color: var(--accent-strong); }
.spill-planned { background: var(--blue-soft); color: var(--blue); }
.spill-cancelled { background: var(--surface-3); color: var(--fg-3); }
.session-body { padding: 4px 18px 18px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 16px; }
.session-meta { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; padding-top: 14px; }
.session-meta .field { flex: 0 0 auto; }
.session-template { display: flex; flex-direction: column; gap: 0; position: relative; }
.st-step { position: relative; padding: 0 0 16px 34px; display: flex; flex-direction: column; gap: 6px; }
.st-step::before { content: ""; position: absolute; left: 11px; top: 26px; bottom: 2px; width: 2px; background: var(--line); }
.st-step:last-child::before { display: none; }
.st-head { display: flex; align-items: center; gap: 4px; margin-left: -34px; }
.st-i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--surface-3); color: var(--fg-2); margin-right: 8px; flex: none; }
.st-head label { font-weight: 700; font-size: 14px; }
.st-prev { font-size: 13px; color: var(--fg-2); background: var(--blue-soft); border-radius: 8px; padding: 7px 10px; }
.st-prev span { font-weight: 700; color: var(--blue); }
.session-foot { display: flex; justify-content: flex-end; }
@media (max-width: 700px) {
  .session-head { grid-template-columns: 34px minmax(0, 1fr) auto; grid-template-areas: "n w p" "n s s"; row-gap: 2px; }
  .session-no { grid-area: n; } .session-when { grid-area: w; } .spill { grid-area: p; } .session-sum { grid-area: s; } .session-chev { display: none; }
  .sessions-actions { margin-left: 0; }
}

/* ---------- Моніторинг ---------- */
